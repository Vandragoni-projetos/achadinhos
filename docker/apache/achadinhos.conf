# ACHADINHOS — vhost de produção (substitui 000-default.conf na imagem)
# DocumentRoot = raiz do projeto (fidelidade à hospedagem tradicional; NÃO usar /public).

ServerName localhost

# Confia no proxy do EasyPanel/Cloudflare para obter o IP real do cliente nos logs.
# Ajuste os ranges se a sua rede interna do EasyPanel for diferente.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html index.htm

    # TLS é terminada no proxy (EasyPanel/Cloudflare). Repassa o esquema original ao PHP
    # para que $_SERVER['HTTPS'] fique correto (cookies de sessão Secure, URLs https).
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---------------------------------------------------------------------
    # SEGURANÇA — bloqueio de download de arquivos sensíveis
    # (camada Apache; NÃO afeta os scripts .php da aplicação)
    # ---------------------------------------------------------------------

    # Extensões que nunca devem ser servidas: dumps, backups, logs, configs, docs, arquivos.
    <FilesMatch "(?i)\.(sql|sqlite|sqlite3|db|dump|env|log|ndjson|bak|backup|old|orig|save|swp|swo|tmp|ini|conf|sh|bash|zsh|lock|dist|example|sample|md|markdown|txt|yml|yaml|zip|tar|gz|tgz|bz2|xz|7z|rar|htaccess|htpasswd)$">
        Require all denied
    </FilesMatch>

    # Dotfiles: .git, .env, .htpasswd, .dockerignore, .DS_Store, etc.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Núcleo do gerador de licença e ferramentas de build — nunca públicos.
    <FilesMatch "(?i)^(core_licenca|encode_licenca|loader_licenca)\.php$">
        Require all denied
    </FilesMatch>

    # Diretórios internos: são incluídos por caminho de ficheiro no PHP (__DIR__),
    # nunca acessados por HTTP. Bloquear o acesso web não quebra nenhum include.
    # ATENÇÃO: cron/ e api/ NÃO entram aqui — precisam continuar acessíveis por HTTP.
    <DirectoryMatch "^/var/www/html/(config|core|helpers|tools|downloads|docker|admin/includes)(/|$)">
        Require all denied
    </DirectoryMatch>

    # storage/ já tem o seu próprio .htaccess (Require all denied); reforço aqui.
    <DirectoryMatch "^/var/www/html/storage(/|$)">
        Require all denied
    </DirectoryMatch>

    # Metadados de VCS em qualquer nível.
    <DirectoryMatch "/\.(git|svn|hg|bzr|cursor)(/|$)">
        Require all denied
    </DirectoryMatch>

    # ---------------------------------------------------------------------
    # uploads/ — conteúdo enviado pelo utilizador
    # Servir imagens/binários legítimos, NUNCA executar scripts.
    # (a lógica de upload da aplicação não é alterada)
    # ---------------------------------------------------------------------
    <Directory /var/www/html/uploads>
        Options -ExecCGI -Indexes -MultiViews
        AllowOverride All
        Require all granted

        <FilesMatch "(?i)\.(php|phtml|phar|pht|phps|php[0-9]|cgi|pl|py|rb|asp|aspx|jsp|sh|htaccess)$">
            Require all denied
        </FilesMatch>

        RemoveHandler .php .phtml .phar .pht .php3 .php4 .php5 .php7 .php8
        RemoveType .php .phtml .phar .pht
    </Directory>

    # Endpoint de healthcheck: sempre acessível, sem cache.
    <Files "healthz.php">
        Require all granted
    </Files>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
