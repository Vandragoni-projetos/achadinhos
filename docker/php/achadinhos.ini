; ACHADINHOS — ajustes de PHP para produção (carregado como conf.d/zz-achadinhos.ini)

; --- Timezone (esperado pelas automações e pelo sync com cron-job.org) ---
date.timezone = America/Sao_Paulo

; --- Exposição ---
expose_php = Off

; --- Recursos ---
; As automações e chamadas a IA podem ser pesadas; os scripts de cron já elevam o
; próprio limite em runtime (set_time_limit). 120s cobre o uso web normal do painel.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; --- Uploads de imagem (produtos, banners, logo, avatar) ---
upload_max_filesize = 16M
post_max_size = 20M

; --- Erros: a aplicação já força display_errors=0 em produção (config/config.php).
;     Mantemos coerência a nível de PHP e registamos no log do container. ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; --- Sessão ---
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
